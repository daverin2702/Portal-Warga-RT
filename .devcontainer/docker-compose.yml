services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www/html:cached
    environment:
      DB_HOST: db
      DB_NAME: db_rt
      DB_USER: root
      DB_PASS: rtdev
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rtdev
    volumes:
      - db_data:/var/lib/mysql
      # file .sql di folder ini diimpor otomatis saat database pertama kali dibuat
      - ../database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro

volumes:
  db_data:
